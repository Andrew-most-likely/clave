name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # upstream.yml runs these jobs when a watched package changes (COMP-5).
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git shellcheck lua jq python qt6-declarative hyprland

      - uses: actions/checkout@v4

      - name: Name check (PROJECT_PLAN.md 5.1)
        run: scripts/name-check.sh

      - name: shellcheck
        run: |
          mapfile -t files < <(
            { ls *.sh lib/*.sh scripts/*.sh tests/*.sh ci/*.sh
              grep -rlE '^#!/usr/bin/env bash|^#!/bin/bash' home/.local/bin home/.local/share/clave home/.config/hypr/scripts home/.config/quickshell
            } 2>/dev/null | sort -u)
          shellcheck -S warning -x "${files[@]}"

      - name: Lua syntax
        run: find home/.config/hypr examples -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Hyprland config
        # Hyprland does not run as root, and the container's user is root.
        run: |
          useradd -m checker
          su checker -c 'export XDG_RUNTIME_DIR=/tmp/xdg-checker HOME=/home/checker && mkdir -p "$XDG_RUNTIME_DIR" &&
            Hyprland --verify-config -c "$PWD/home/.config/hypr/hyprland.lua" 2>&1 || true' | tee /tmp/verify.log | tail -n 20
          grep -q 'config ok' /tmp/verify.log

      - name: QML syntax
        run: |
          out=$(/usr/lib/qt6/bin/qmllint $(find home/.config/quickshell -name '*.qml') 2>&1 || true)
          if echo "$out" | grep '\[syntax\]'; then exit 1; fi

      - name: JSON
        run: |
          for f in home/.config/clave/*.json home/.config/swaync/config.json; do jq empty "$f"; done
          # dock.json starts with a /* */ comment block, like the Dock reads it
          sed '1,/\*\//d' home/.config/quickshell/DockApp/dock.json | jq empty

      - name: Python
        run: |
          mapfile -t py < <(grep -rlE '^#!/usr/bin/env python3' home/.local/bin tests; echo home/.local/share/clave/wallpaper-portal.py)
          for f in "${py[@]}"; do python -c 'import sys, py_compile; py_compile.compile(sys.argv[1], doraise=True)' "$f"; done

  install:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq python rsync diffutils findutils which hyprland imagemagick file python-icalendar python-vobject python-dateutil openssh

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration test installs an older release first

      - name: Install and uninstall into a test user's home
        run: |
          useradd -m tester
          cp -r "$PWD" /home/tester/repo && chown -R tester: /home/tester/repo
          su tester -c 'bash /home/tester/repo/tests/install-test.sh'

      - name: Update from the old names
        run: su tester -c 'bash /home/tester/repo/tests/migrate-test.sh'

      - name: Update from v1.0.0 (APP-2, SHELL-2)
        run: su tester -c 'bash /home/tester/repo/tests/update-test.sh'

      - name: System Settings (Lock Screen, settings readers, search)
        run: su tester -c 'bash /home/tester/repo/tests/settings-test.sh'

      - name: Disk Encryption config writers (SEC-5)
        run: su tester -c 'bash /home/tester/repo/tests/encrypt-unit.sh'

      - name: Displays, app names and icons, Calendar and Contacts files
        run: |
          su tester -c 'bash /home/tester/repo/tests/displays-test.sh'
          su tester -c 'bash /home/tester/repo/tests/apps-test.sh'
          su tester -c 'bash /home/tester/repo/tests/pim-test.sh'

      - name: Compatibility check, pacman hook, clave-doctor, upstream diff (COMP-5 to COMP-9)
        run: su tester -c 'bash /home/tester/repo/tests/compat-test.sh'
