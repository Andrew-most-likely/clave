# macOS lock screen. The background is a blurred copy of the desktop picture
# that macos-wallpaper writes; the avatar is ~/.face.

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.cache/macos-look/lock.png
    color = rgba(30, 30, 34, 1.0)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.85)
    font_size = 22
    font_family = SF Pro Display Semibold
    position = 0, -90
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 0.9)
    font_size = 110
    font_family = SF Pro Display Bold
    position = 0, -125
    halign = center
    valign = top
}

# Avatar
image {
    monitor =
    path = $HOME/.face
    size = 72
    rounding = -1
    border_size = 0
    position = 0, 190
    halign = center
    valign = bottom
}

# User name
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 14
    font_family = SF Pro Text Semibold
    position = 0, 160
    halign = center
    valign = bottom
}

# Password field
input-field {
    monitor =
    size = 190, 32
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.2)
    font_color = rgba(255, 255, 255, 1)
    font_family = SF Pro Text
    check_color = rgba(255, 255, 255, 0.35)
    fail_color = rgba(255, 69, 58, 0.5)
    fail_text = Incorrect password
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    hide_input = false
    position = 0, 110
    halign = center
    valign = bottom
}

