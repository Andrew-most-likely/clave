# kitty. Your changes go in custom.conf (loaded last).
font_family                 JetBrains Mono
bold_font                   JetBrains Mono Semibold
italic_font                 auto
bold_italic_font            auto
font_size                   12

window_padding_width        10
hide_window_decorations     yes
background_opacity          0.85
dynamic_background_opacity  yes
remember_window_size        no
initial_window_width        950
initial_window_height       560
confirm_os_window_close     0
enable_audio_bell           no

cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            5000

# Dark palette
foreground            #f2f2f2
background            #1e1e1e
selection_foreground  none
selection_background  #3a5a86
cursor                #f2f2f2
color0  #1e1e1e
color8  #686868
color1  #ff5f57
color9  #ff7b72
color2  #28c840
color10 #5af78e
color3  #febc2e
color11 #ffd866
color4  #0a84ff
color12 #57a5ff
color5  #bf5af2
color13 #da8fff
color6  #5ac8fa
color14 #8ce0ff
color7  #d8d8d8
color15 #ffffff

include custom.conf
