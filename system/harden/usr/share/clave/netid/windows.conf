# Network Identity profile (SEC-7). Read by clave-netid; keys are fixed, values are never user input.
# Sources: p0f.fp "g:win:Windows:NT kernel" (TCP), a Windows 11 capture for DHCP (option 55 and 60).
name=Windows 11
ttl=128
timestamps=0
# SYN option order (mss nop ws sok ts eol); empty keeps the kernel's order and starts no rewriter.
syn_order=mss,nop,ws,nop,nop,sok
# SYN window; 0 keeps the kernel's 64240, which Windows 11 also sends.
syn_window=0
dhcp_prl=1,3,6,15,31,33,43,44,46,47,119,121,249,252
dhcp_vendor=MSFT 5.0
dhcp_max_message_size=0
# Hostname sent with DHCP: desktop (DESKTOP-XXXXXXX, new each connect), macbook, iphone or none.
hostname=desktop
ping=0
# Closed ports: reply (TCP RST, ICMP port unreachable, as the stack does) or drop.
# Windows Defender Firewall drops unasked inbound traffic on a public network.
closed=drop
# Captive portal browser. @FFVER@ becomes the installed Firefox major version.
ua=Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:@FFVER@.0) Gecko/20100101 Firefox/@FFVER@.0
ua_platform=Win32
ua_oscpu=Windows NT 10.0; Win64; x64
