# Network Identity profile (SEC-7). Read by clave-netid; keys are fixed, values are never user input.
# Sources: p0f.fp "s:unix:Linux:(Android)" (TCP: the Linux kernel's own SYN, so no rewrite),
# satori dhcp.xml "Android 11.x" to "Android 14.x" (DHCP).
name=Android
ttl=64
timestamps=1
syn_order=
syn_window=0
dhcp_prl=1,3,6,15,26,28,51,58,59,43,114,108
dhcp_vendor=android-dhcp-14
dhcp_max_message_size=1
hostname=none
ping=1
# Closed ports: reply (TCP RST, ICMP port unreachable, as the stack does) or drop.
closed=reply
ua=Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36
ua_platform=Linux armv81
ua_oscpu=Linux armv81
