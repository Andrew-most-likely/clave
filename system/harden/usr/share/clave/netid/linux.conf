# Network Identity profile (SEC-7). Read by clave-netid; keys are fixed, values are never user input.
# The laptop as it is: kernel TCP, dhcpcd's own request list.
name=Linux
ttl=64
timestamps=1
syn_order=
syn_window=0
dhcp_prl=
dhcp_vendor=
dhcp_max_message_size=1
hostname=none
ping=1
# Closed ports: reply (TCP RST, ICMP port unreachable, as the stack does) or drop.
closed=reply
ua=Mozilla/5.0 (X11; Linux x86_64; rv:@FFVER@.0) Gecko/20100101 Firefox/@FFVER@.0
ua_platform=Linux x86_64
ua_oscpu=Linux x86_64
