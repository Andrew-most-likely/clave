# Network Identity profile (SEC-7). Read by clave-netid; keys are fixed, values are never user input.
# Sources: p0f.fp "s:unix:iOS" (TCP), iOS 15 and later DHCP (iOS 14 sent the same list without 108).
name=iPhone
ttl=64
timestamps=1
syn_order=mss,nop,ws,nop,nop,ts,sok,eol
syn_window=65535
dhcp_prl=1,121,3,6,15,108,114,119,252
dhcp_vendor=
dhcp_max_message_size=1
hostname=iphone
ping=1
# Closed ports: reply (TCP RST, ICMP port unreachable, as the stack does) or drop.
closed=reply
ua=Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1
ua_platform=iPhone
ua_oscpu=iPhone OS 18_6
