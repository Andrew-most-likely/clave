#!/usr/bin/nft -f
# Inbound firewall (hardening setup, phase 3). No services exposed.
# Own table name: OpenSnitch manages "inet filter" and sets its policies to accept.

destroy table inet hardening
table inet hardening {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    iifname "virbr0" accept comment "libvirt NAT (DHCP, DNS)"
    jump netid_in comment "Network Identity: ping and Stealth (clave-netid fills it)"
		udp dport 5353 ip daddr 224.0.0.251 accept comment "mDNS (printer discovery via avahi)"
		udp dport 5353 ip6 daddr ff02::fb accept comment "mDNS IPv6"
    meta l4proto ipv6-icmp accept comment "IPv6 needs ICMPv6 (NDP, RA)"
    meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
    udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
    jump netid_closed comment "Network Identity: closed-port answers (clave-netid fills it)"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop

    ct state {established, related} accept comment "return traffic"
    iifname "virbr0" accept comment "libvirt VMs out"
  }
  chain output {
    type filter hook output priority filter
    policy accept

    jump netid_out comment "Network Identity: SYN rewriter queue (clave-netid fills it)"
  }
  # Network Identity (SEC-7). Empty while the feature is off; clave-netid fills
  # them. They live in this table because an accept in another table cannot
  # undo a drop here.
  chain netid_in {
  }
  chain netid_closed {
  }
  chain netid_out {
  }
}
