# Clave (PROJECT_PLAN.md APP-6): no location lookups over the network.
# Clocks and Maps ask for a city instead. geoclue is D-Bus
# activated: it starts only when an app asks and has nothing to look up.

# Wi-Fi and cell tower positioning send nearby networks to an online service.
[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[network-nmea]
enable=false

[compass]
enable=false

[static-source]
enable=false
